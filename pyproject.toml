[project]
name = "esphome-mcp"
dynamic = ["version"]
description = "MCP server for the ESPHome 2026.6+ Device Builder dashboard"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "loryanstrant", email = "loryan@loryanstrant.com" }]
dependencies = [
    # Bounded, not floating: the HTTP transport's session-retention behaviour changed
    # inside the 3.4.x line, and an open-ended range means a rebuild silently picks up
    # whatever is current. `mcp` is bounded alongside it because fastmcp's own range on
    # it is loose. See DECISIONS.md (2026-08-30).
    "fastmcp>=3.4.7,<3.5",
    "mcp>=1.29.0,<1.30",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pydantic-settings>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/loryanstrant/ESPHome-MCP"
"Upstream (kdkavanagh)" = "https://github.com/kdkavanagh/esphome-mcp"

[project.scripts]
esphome-mcp = "esphome_mcp.__main__:main"
esphome-mcp-web = "esphome_mcp.__main__:main_web"

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "ty==0.0.63",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "esphome",
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that require a real ESPHome dashboard (set ESPHOME_DASHBOARD_URL)",
]

[tool.ty.environment]
python-version = "3.13"
